<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline • Cupid Mail</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #2A221F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #ECE3D6;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px -2px rgba(136, 19, 55, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #881337;
      margin-bottom: 8px;
      font-family: monospace, sans-serif;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #786B65;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF1F2;
      color: #9F1239;
      font-size: 11px;
      font-family: monospace;
      padding: 4px 12px;
      border-radius: 9999px;
      border: 1px solid #FECDD6;
      margin-bottom: 20px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #E11D48;
      border-radius: 50%;
    }
    button {
      background: linear-gradient(135deg, #881337, #9F1239);
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-family: monospace;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(136, 19, 55, 0.2);
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/Logo.png" alt="Cupid Mail" class="logo" />
    <div class="badge">
      <span class="dot"></span>
      <span>Connection Paused</span>
    </div>
    <h1>You are currently offline</h1>
    <p>
      Cupid Mail requires an internet connection to sync fresh letters and dispatch mail.
      Please check your network and try again.
    </p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
